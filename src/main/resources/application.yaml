server:
  port: 8888
spring:
  application:
    name: chat-service

  # Doc file .env o goc project (dang KEY=value) neu co. Spring KHONG tu doc .env,
  # dong nay moi khien no doc. .env da nam trong .gitignore, khong vao repo.
  config:
    import: optional:file:.env[.properties]

  # Java 21: request chay tren virtual thread, nen khong can thread pool rieng cho
  # tang web. Chi noi nao can backpressure moi dung executor rieng (xem AsyncConfig).
  threads:
    virtual:
      enabled: true

  # Postgres. Dat 3 bien moi truong, KHONG hardcode vao file nay (file nay vao repo).
  # Chay DB local bang docker-compose.yaml (service ds-chat):
  #   DB_URL=jdbc:postgresql://localhost:5432/chat_service
  #   DB_USER=chat
  #   DB_PASSWORD=chat
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000

  jpa:
    # Flyway la nguon su that duy nhat cua schema. Khong de Hibernate tu sinh
    # hay sua bang: nhu vay schema o local va production se lech nhau.
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    "com.side_project.chat_service": DEBUG
